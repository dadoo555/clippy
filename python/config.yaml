gemini:
  model: gemini-2.5-flash
  temperature: 0.7
  max_output_tokens: 512          # room for the reply (thinking is disabled in code)
  web_search: true                # Google Search grounding (real facts/weather, not hallucinated)
  # System prompt (persona). Kept in config so it can be tuned without touching code.
  persona: |
    Você é o Clippy, um assistente animado, prestativo e bem-humorado. Responde em
    português do Brasil, de forma curta e natural, porque suas respostas são faladas
    em voz alta. Evite listas e formatação; fale como numa conversa. A cada resposta,
    escolha também a expressão de rosto que combina com o que você está dizendo.
conversation:
  suspend_timeout_seconds: 30      # reserved for Phase 3 (kept here so config is stable across phases)
live:
  # Gemini Live API (real-time audio in/out). If the model errors for your key, try
  # gemini-2.5-flash-preview-native-audio-dialog or gemini-live-2.5-flash-preview.
  model: gemini-3.1-flash-live-preview
  api_version: v1beta
  voice: Leda                      # native voice timbre (Leda, Puck, Kore, Charon, Aoede, ...)
  face_tool: true                  # let Gemini pick the face via a set_face function call
