gemini:
  model: gemini-2.5-flash
  temperature: 0.7
  max_output_tokens: 512          # room for the reply (thinking is disabled in code)
  web_search: true                # Google Search grounding (real facts/weather, not hallucinated)
  # System prompt (persona). Kept in config so it can be tuned without touching code.
  persona: |
    Você é o Clippy, um assistente animado, prestativo e bem-humorado. Responde em
    português do Brasil ou em alemão da Alemanha, de forma curta e natural, porque suas respostas são faladas
    em voz alta. Evite listas e formatação; fale como numa conversa. A cada resposta,
    escolha também a expressão de rosto que combina com o que você está dizendo.
live:
  # Gemini Live API (real-time audio in/out). If the model errors for your key, try
  # gemini-2.5-flash-preview-native-audio-dialog or gemini-live-2.5-flash-preview.
  model: gemini-3.1-flash-live-preview
  api_version: v1beta
  voice: Leda                      # native voice timbre (Leda, Puck, Kore, Charon, Aoede, ...)
  face_tool: true                  # let Gemini pick the face via a set_face function call
  inactivity_timeout_s: 15         # after this much silence, go back to sleep (wait for "clippy")
  speech_level: 300                # mic amplitude that counts as "you're talking" (keeps it awake)
  half_duplex: true                # mute mic while Gemini talks (kills echo cutting it off; no barge-in)
  input_device: null               # sounddevice input index/name (null = system default)
  output_device: null              # sounddevice output index/name (null = system default)
wake:
  enabled: true                    # wake word ON: sleeps until it hears "clippy" (no API cost idle)
  # Pasta do modelo Vosk (wake word offline). Caminho relativo é procurado em 3 lugares: de onde
  # você roda, em python/, e na RAIZ do repo (~/clippy). Então o padrão abaixo acha o modelo esteja
  # ele na raiz do repo ou em python/. Vazio = wake word desligado (entra direto numa sessão).
  # Exemplos:
  #   Ubuntu/Debian (padrão): ./vosk-model-small-en-us-0.15   (acha em ~/clippy/ ou ~/clippy/python/)
  #   Windows:                .\vosk-model-small-en-us-0.15
  #   absoluto, se preferir:  /home/arduino/clippy/vosk-model-small-en-us-0.15
  # Outros modelos: https://alphacephei.com/vosk/models
  model_path: "./vosk-model-small-en-us-0.15"
  phrases: [clip, clipe, clipi, clippy, clique]
